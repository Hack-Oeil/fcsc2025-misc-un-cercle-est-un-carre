services:
  ssh-572.cyrhades.fr:
    container_name: ssh-572
    build:
      context: ./.docker/ssh
      args:
        LANGUAGE: ${LANGUAGE:-fr}
    labels:
      ho.ctf.cyrhades: "challenge"
      ho.ctf.cyrhades.webssh: "1"
    environment:
      SSH_HOSTNAME: "ssh-572.cyrhades.fr"
      SSH_PORT: 22
      SSH_USERNAME: "cyrhades"
      SSH_PASSWORD: "secret"
    restart: unless-stopped
  un-cercle-est-un-carre.cyrhades.fr:
    image: anssi/fcsc2025-misc-un-cercle-est-un-carre:latest
